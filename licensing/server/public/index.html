<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>License Server Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      background: #0a0a0f;
      color: #e4e4e7;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    /* ── Terminal header ── */
    .terminal-bar {
      background: #1a1a2e;
      border: 1px solid rgba(217,119,6,0.3);
      border-radius: 8px 8px 0 0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .terminal-bar .dots { display: flex; gap: 6px; }
    .terminal-bar .dot { width: 10px; height: 10px; border-radius: 50%; }
    .terminal-bar .dot.r { background: #ef4444; }
    .terminal-bar .dot.y { background: #f59e0b; }
    .terminal-bar .dot.g { background: #10b981; }
    .terminal-bar .title { color: rgba(217,119,6,0.5); font-size: 11px; }
    .terminal-body {
      background: #0d0d1a;
      border: 1px solid rgba(217,119,6,0.3);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 24px;
    }

    /* ── Auth screen ── */
    .auth-box { max-width: 420px; margin: 80px auto; }
    .auth-box .terminal-body { text-align: center; }
    .auth-box h1 { color: #f59e0b; font-size: 20px; margin-bottom: 4px; }
    .auth-box .sub { color: #52525b; font-size: 12px; margin-bottom: 20px; }
    .auth-box input {
      width: 100%;
      background: #0a0a15;
      border: 1px solid rgba(217,119,6,0.3);
      border-radius: 6px;
      padding: 10px 14px;
      color: #f59e0b;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
    }
    .auth-box input:focus { border-color: rgba(217,119,6,0.6); box-shadow: 0 0 0 1px rgba(217,119,6,0.15); }
    .auth-box input::placeholder { color: #3f3f46; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .5px;
      transition: all .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn-amber { background: #d97706; color: #000; }
    .btn-amber:hover:not(:disabled) { background: #f59e0b; box-shadow: 0 0 16px rgba(217,119,6,.2); }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-blue:hover:not(:disabled) { background: #3b82f6; }
    .btn-red { background: #dc2626; color: #fff; }
    .btn-red:hover:not(:disabled) { background: #ef4444; }
    .btn-outline {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
    }
    .btn-outline:hover { border-color: #52525b; color: #e4e4e7; }
    .btn-sm { padding: 6px 12px; font-size: 11px; }
    .btn-icon {
      padding: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #71717a;
      border-radius: 4px;
      transition: all .15s;
    }
    .btn-icon:hover { background: rgba(37,99,235,.15); color: #3b82f6; }
    .btn-icon.danger:hover { background: rgba(220,38,38,.15); color: #ef4444; }

    /* ── Layout ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 20px; color: #f59e0b; }
    .header .sub { font-size: 11px; color: #52525b; }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    /* ── Cards ── */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .card {
      background: #0d0d1a;
      border: 1px solid rgba(217,119,6,0.15);
      border-radius: 8px;
      padding: 16px;
    }
    .card .label { font-size: 10px; color: #52525b; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .card .value.green { color: #10b981; }
    .card .value.red { color: #ef4444; }
    .card .value.amber { color: #f59e0b; }

    /* ── Search ── */
    .search-wrap { position: relative; max-width: 320px; margin-bottom: 16px; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: #52525b; }
    .search-wrap input {
      width: 100%;
      background: #0a0a15;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 12px 8px 30px;
      color: #e4e4e7;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    .search-wrap input:focus { border-color: rgba(217,119,6,.4); }
    .search-wrap input::placeholder { color: #3f3f46; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      text-align: left;
      padding: 10px 12px;
      font-weight: 600;
      color: #71717a;
      border-bottom: 1px solid #27272a;
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #18181b;
      vertical-align: middle;
    }
    tr:hover td { background: rgba(255,255,255,.02); }
    .key-cell { display: flex; align-items: center; gap: 6px; }
    .key-cell code {
      background: #18181b;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #f59e0b;
    }
    .status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .status.active { background: rgba(16,185,129,.15); color: #10b981; }
    .status.expired { background: rgba(239,68,68,.15); color: #ef4444; }
    .status.suspended { background: rgba(245,158,11,.15); color: #f59e0b; }
    .status.premium { background: rgba(99,102,241,.15); color: #818cf8; }
    .status.standard { background: rgba(113,113,122,.15); color: #a1a1aa; }
    .empty { text-align: center; padding: 48px 0; color: #52525b; font-size: 13px; }
    .actions-cell { display: flex; gap: 2px; justify-content: flex-end; }
    .text-mono { color: #71717a; font-size: 11px; }
    .hide-sm { display: none; }
    @media(min-width:640px){ .hide-sm { display: table-cell; } }
    .hide-md { display: none; }
    @media(min-width:768px){ .hide-md { display: table-cell; } }
    .hide-lg { display: none; }
    @media(min-width:1024px){ .hide-lg { display: table-cell; } }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #0d0d1a;
      border: 1px solid rgba(217,119,6,.3);
      border-radius: 10px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { font-size: 16px; color: #f59e0b; margin-bottom: 16px; }
    .modal .close {
      float: right;
      background: none;
      border: none;
      color: #52525b;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }
    .modal .close:hover { color: #e4e4e7; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; color: #71717a; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      background: #0a0a15;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 8px 12px;
      color: #e4e4e7;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: rgba(217,119,6,.4); }
    .form-group .req { color: #ef4444; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: #1a1a2e;
      border: 1px solid rgba(217,119,6,.3);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #e4e4e7;
      animation: slideIn .2s ease;
      max-width: 360px;
    }
    .toast.success { border-color: rgba(16,185,129,.4); }
    .toast.error { border-color: rgba(239,68,68,.4); }
    .toast.info { border-color: rgba(59,130,246,.4); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(217,119,6,.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Confirm dialog ── */
    .confirm-icon { font-size: 32px; text-align: center; margin-bottom: 12px; }
    .confirm-text { text-align: center; font-size: 13px; color: #a1a1aa; margin-bottom: 16px; line-height: 1.5; }
  </style>
</head>
<body>

<div id="app"></div>
<div class="toast-container" id="toasts"></div>

<script>
// ── State ──
let state = {
  authenticated: !!localStorage.getItem('_licenseAdminSecret'),
  adminSecret: localStorage.getItem('_licenseAdminSecret') || '',
  licenses: [],
  loading: false,
  search: '',
};

// ── Toast ──
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3500);
}

// ── API helper ──
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.adminSecret) headers['x-admin-secret'] = state.adminSecret;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || data.reason || `HTTP ${resp.status}`);
  return data;
}

// ── Format helpers ──
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '—'; }
function daysLeft(d) { if(!d) return null; return Math.ceil((new Date(d)-Date.now())/(86400000)); }

// ── Render ──
function render() {
  const app = document.getElementById('app');

  if (!state.authenticated) {
    app.innerHTML = `
      <div class="auth-box">
        <div class="terminal-bar">
          <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
          <span class="title">license-server admin</span>
        </div>
        <div class="terminal-body">
          <h1>🔐 License Server</h1>
          <p class="sub">Enter the admin secret to manage licenses</p>
          <input type="password" id="secret-input" placeholder="Enter ADMIN_SECRET" autofocus style="margin-bottom:12px">
          <button class="btn btn-amber" id="auth-btn" style="width:100%;justify-content:center">Connect</button>
          <p style="margin-top:16px;font-size:10px;color:#3f3f46">Stored locally in your browser</p>
        </div>
      </div>`;
    document.getElementById('auth-btn').onclick = () => {
      const val = document.getElementById('secret-input').value.trim();
      if (!val) return toast('Enter the admin secret', 'error');
      localStorage.setItem('_licenseAdminSecret', val);
      state.adminSecret = val;
      state.authenticated = true;
      toast('Connected', 'success');
      render();
    };
    document.getElementById('secret-input').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('auth-btn').click(); };
    return;
  }

  // Build table rows
  const q = state.search.toLowerCase();
  const filtered = state.licenses.filter(l =>
    !q || l.key.toLowerCase().includes(q) || (l.customerName||'').toLowerCase().includes(q) || (l.customerEmail||'').toLowerCase().includes(q)
  );

  const total = state.licenses.length;
  const active = state.licenses.filter(l => l.status==='active').length;
  const expired = state.licenses.filter(l => l.status==='expired').length;
  const suspended = state.licenses.filter(l => l.status==='suspended').length;

  const rows = filtered.map(l => {
    const dl = daysLeft(l.expiresAt);
    const renewDisabled = l.status === 'suspended' ? 'disabled' : '';
    const isActive = l.status === 'active';
    return `<tr>
      <td>
        <div class="key-cell">
          <code>${l.key}</code>
          <button class="btn-icon" onclick="copyKey('${l.key}')" title="Copy key">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </button>
        </div>
        <span class="hide-sm text-mono">${l.customerEmail}</span>
      </td>
      <td><div>${l.customerName}</div>${l.customerPhone ? `<div class="text-mono">${l.customerPhone}</div>` : ''}</td>
      <td class="hide-sm">${l.customerEmail}</td>
      <td style="text-align:center"><span class="status ${l.plan === 'premium' ? 'premium' : 'standard'}">${l.plan || 'standard'}</span></td>
      <td style="text-align:center"><span class="status ${l.status}">${l.status}</span></td>
      <td class="hide-md" style="text-align:center">
        <div>${fmtDate(l.expiresAt)}</div>
        ${l.status==='active' && dl !== null && dl <= 30 ? `<div class="text-mono" style="color:#f59e0b">${dl}d left</div>` : ''}
      </td>
      <td class="hide-lg"><code class="text-mono">${l.machineId || '—'}</code></td>
      <td>
        <div class="actions-cell">
          <button class="btn-icon" onclick="openRenew('${l.key}')" title="Renew" ${renewDisabled}>
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8 8 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8 8 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
          ${isActive
            ? `<button class="btn-icon danger" onclick="confirmSuspend('${l.key}')" title="Suspend">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
              </button>`
            : `<button class="btn-icon" style="color:#10b981" onclick="confirmUnsuspend('${l.key}')" title="Unsuspend">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </button>`
          }
        </div>
      </td>
    </tr>`;
  }).join('');

  app.innerHTML = `
    <div class="container">
      <div class="terminal-bar">
        <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>          <span class="title">license@bythebuzz:~$ ./admin</span>
      </div>
      <div class="terminal-body">
        <!-- Header -->
        <div class="header">
          <div>
            <h1>License Management</h1>
            <div class="sub">${state.loading ? 'Loading...' : `${total} license${total !== 1 ? 's' : ''}`}</div>
          </div>
          <div class="header-actions">
            <button class="btn btn-outline btn-sm" onclick="disconnect()">Disconnect</button>
            <button class="btn btn-blue btn-sm" onclick="openGenerate()">+ Generate</button>
            <button class="btn btn-amber btn-sm" onclick="fetchLicenses()" id="refresh-btn">↻ Refresh</button>
          </div>
        </div>

        <!-- Cards -->
        <div class="cards">
          <div class="card"><div class="label">Total</div><div class="value">${total}</div></div>
          <div class="card" style="border-color:rgba(16,185,129,.2)"><div class="label">Active</div><div class="value green">${active}</div></div>
          <div class="card" style="border-color:rgba(239,68,68,.2)"><div class="label">Expired</div><div class="value red">${expired}</div></div>
          <div class="card" style="border-color:rgba(245,158,11,.2)"><div class="label">Suspended</div><div class="value amber">${suspended}</div></div>
          <div class="card" style="border-color:rgba(99,102,241,.2)"><div class="label">Premium</div><div class="value" style="color:#818cf8">${state.licenses.filter(l => l.plan === 'premium').length}</div></div>
        </div>

        <!-- Search -->
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" placeholder="Search by name, email, or key..." value="${state.search}" oninput="state.search=this.value;render()">
        </div>

        <!-- Table -->
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Key</th><th>Customer</th><th class="hide-sm">Email</th><th style="text-align:center">Plan</th><th style="text-align:center">Status</th><th class="hide-md" style="text-align:center">Expires</th><th class="hide-lg">Machine</th><th style="text-align:right">Actions</th>
            </tr></thead>
            <tbody>
              ${state.loading ? `<tr><td colspan="7" class="empty"><span class="spinner"></span> Loading licenses...</td></tr>`
                : filtered.length === 0 ? `<tr><td colspan="7" class="empty">${state.search ? 'No matches' : 'No licenses yet'}</td></tr>`
                : rows}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Generate Modal -->
    <div class="modal-overlay" id="generate-modal">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="close" onclick="closeGenerate()">&times;</button>
        <h2>Generate License Key</h2>
        <div class="form-group">
          <label>Customer Name <span class="req">*</span></label>
          <input id="gen-name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Customer Email <span class="req">*</span></label>
          <input type="email" id="gen-email" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label>Customer Phone</label>
          <input id="gen-phone" placeholder="+254700000000">
        </div>
        <div class="form-group">
          <label>Validity Period</label>
          <select id="gen-days">
            <option value="10m">10 minutes (testing)</option>
            <option value="10">10 days</option>
            <option value="30">30 days (1 month)</option>
            <option value="90">90 days (3 months)</option>
            <option value="180">180 days (6 months)</option>
            <option value="365" selected>365 days (1 year)</option>
            <option value="730">730 days (2 years)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Plan</label>
          <select id="gen-plan">
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline btn-sm" onclick="closeGenerate()">Cancel</button>
          <button class="btn btn-blue btn-sm" id="gen-submit" onclick="handleGenerate()">Generate</button>
        </div>
      </div>
    </div>

    <!-- Renew Modal -->
    <div class="modal-overlay" id="renew-modal">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="close" onclick="closeRenew()">&times;</button>
        <h2>Renew License</h2>
        <div class="form-group">
          <label>Extension Period</label>
          <select id="renew-days">
            <option value="10m">10 minutes (testing)</option>
            <option value="10">10 days</option>
            <option value="30">30 days (1 month)</option>
            <option value="90">90 days (3 months)</option>
            <option value="180">180 days (6 months)</option>
            <option value="365" selected>365 days (1 year)</option>
            <option value="730">730 days (2 years)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Change Plan</label>
          <select id="renew-plan">
            <option value="">Keep current plan</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline btn-sm" onclick="closeRenew()">Cancel</button>
          <button class="btn btn-amber btn-sm" id="renew-submit" onclick="handleRenew()">Renew</button>
        </div>
      </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirm-modal">
      <div class="modal" style="max-width:380px;text-align:center" onclick="event.stopPropagation()">
        <div class="confirm-icon" id="confirm-icon">🔄</div>
        <h2 id="confirm-title">Confirm</h2>
        <div class="confirm-text" id="confirm-msg">Are you sure?</div>
        <div class="modal-actions" style="justify-content:center">
          <button class="btn btn-outline btn-sm" onclick="closeConfirm()">Cancel</button>
          <button class="btn btn-sm" id="confirm-action">Confirm</button>
        </div>
      </div>
    </div>
  `;

  // Wire up overlay clicks
  document.getElementById('generate-modal').onclick = closeGenerate;
  document.getElementById('renew-modal').onclick = closeRenew;
  document.getElementById('confirm-modal').onclick = closeConfirm;
}

// ── Actions ──

async function fetchLicenses() {
  if (!state.adminSecret) return;
  state.loading = true;
  render();
  try {
    const data = await api('GET', '/licenses');
    state.licenses = data.licenses || [];
  } catch (err) {
    if (err.message.includes('Forbidden') || err.message.includes('403')) {
      toast('Invalid admin secret', 'error');
      disconnect();
      return;
    }
    toast(err.message, 'error');
  } finally {
    state.loading = false;
    render();
  }
}

function disconnect() {
  localStorage.removeItem('_licenseAdminSecret');
  state.adminSecret = '';
  state.authenticated = false;
  state.licenses = [];
  toast('Disconnected', 'info');
  render();
}

function copyKey(key) {
  navigator.clipboard.writeText(key).then(() => toast('Copied!', 'success'), () => toast('Copy failed', 'error'));
}

// ── Generate ──
function openGenerate() {
  document.getElementById('generate-modal').classList.add('open');
  setTimeout(() => document.getElementById('gen-name').focus(), 100);
}
function closeGenerate() { document.getElementById('generate-modal').classList.remove('open'); }

async function handleGenerate() {
  const name = document.getElementById('gen-name').value.trim();
  const email = document.getElementById('gen-email').value.trim();
  const phone = document.getElementById('gen-phone').value.trim();
  const period = document.getElementById('gen-days').value;
  if (!name || !email) return toast('Name and email required', 'error');

  // Build payload — support minute-based testing periods
  const plan = document.getElementById('gen-plan').value;
  const payload = { customerName: name, customerEmail: email, customerPhone: phone || undefined, plan };
  if (period.endsWith('m')) {
    payload.validityMinutes = parseInt(period, 10);
  } else {
    payload.validityDays = parseInt(period, 10) || 365;
  }

  const btn = document.getElementById('gen-submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const data = await api('POST', '/generate', payload);      toast(`Generated: ${data.license.key} (${data.license.plan})`, 'success');
    closeGenerate();
    await fetchLicenses();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate';
  }
}

// ── Confirm dialog ──
let pendingAction = null;

function closeConfirm() { document.getElementById('confirm-modal').classList.remove('open'); pendingAction = null; }

function showConfirm(title, msg, icon, btnClass, btnText, onConfirm) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-icon').textContent = icon;
  const btn = document.getElementById('confirm-action');
  btn.className = `btn btn-sm ${btnClass}`;
  btn.textContent = btnText;
  btn.onclick = async () => {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      await onConfirm();
      closeConfirm();
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = btnText;
    }
  };
  document.getElementById('confirm-modal').classList.add('open');
}

// ── Renew modal ──
let renewingKey = '';

function openRenew(key) {
  renewingKey = key;
  document.getElementById('renew-modal').classList.add('open');
}
function closeRenew() {
  document.getElementById('renew-modal').classList.remove('open');
  renewingKey = '';
}

async function handleRenew() {
  const period = document.getElementById('renew-days').value;
  const newPlan = document.getElementById('renew-plan').value;
  const payload = { key: renewingKey };
  if (period.endsWith('m')) {
    payload.validityMinutes = parseInt(period, 10);
  } else {
    payload.days = parseInt(period, 10);
  }
  if (newPlan) {
    payload.plan = newPlan;
  }

  const btn = document.getElementById('renew-submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const data = await api('POST', '/renew', payload);
    const planMsg = newPlan ? `, plan: ${newPlan}` : '';
    toast(`Renewed until ${data.license.expiresAt.slice(0,10)}${planMsg}`, 'success');
    closeRenew();
    await fetchLicenses();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Renew';
  }
}

function confirmSuspend(key) {
  showConfirm('Suspend License', `Suspend ${key}? It will stop working immediately.`, '⚠️', 'btn-red', 'Suspend', async () => {
    await api('POST', '/suspend', { key });
    toast(`Suspended ${key}`, 'success');
    await fetchLicenses();
  });
}

function confirmUnsuspend(key) {
  showConfirm('Unsuspend License', `Reactivate ${key}? It will start working again.`, '✅', 'btn-blue', 'Unsuspend', async () => {
    await api('POST', '/unsuspend', { key });
    toast(`Reactivated ${key}`, 'success');
    await fetchLicenses();
  });
}

// ── Init ──
render();
if (state.authenticated) fetchLicenses();

// Auto-refresh every 5 minutes (don't interrupt typing)
setInterval(() => {
  if (state.authenticated && !state.loading) {
    // Skip refresh if the user is actively typing in an input or a modal is open
    const active = document.activeElement;
    const hasOpenModal = document.querySelector('.modal-overlay.open');
    if (hasOpenModal || (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA'))) {
      return;
    }
    fetchLicenses();
  }
}, 300000);
</script>
</body>
</html>
